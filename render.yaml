services:
  - type: web
    name: chatbot-web
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: ollama-models
      mountPath: /root/.ollama
      sizeGB: 1
    envVars:
      - key: OLLAMA_MODEL
        value: qwen2.5:0.5b
