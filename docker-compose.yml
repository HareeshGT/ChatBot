services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-ollama-chatbot
    ports:
      - "${PORT:-8000}:8000"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      PORT: 8000
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # For NVIDIA GPU acceleration, install NVIDIA Container Toolkit and
    # uncomment the deploy reservation below.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama_data:
